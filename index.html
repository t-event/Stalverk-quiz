<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stålverket – Smelteprøven</title>
<meta name="description" content="Lær stålverket gjennom et quizspill: fra skraplageret til strengen.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<style>
  :root {
    --bg: #f4f1ec;
    --surface: #ffffff;
    --surface-2: #ece6dd;
    --text: #1d1a17;
    --muted: #6b635a;
    --border: #d9d0c4;
    --accent: #e8590c;
    --accent-2: #f59f00;
    --accent-ink: #ffffff;
    --good: #2b8a3e;
    --good-bg: #e6f4ea;
    --bad: #c92a2a;
    --bad-bg: #fdecec;
    --glow: rgba(232, 89, 12, .25);
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12100e;
      --surface: #1d1a17;
      --surface-2: #2a2622;
      --text: #f3eee8;
      --muted: #a39a90;
      --border: #3a342e;
      --accent: #ff7a1a;
      --accent-2: #ffc14d;
      --accent-ink: #1a0d03;
      --good: #51cf66;
      --good-bg: #16301e;
      --bad: #ff6b6b;
      --bad-bg: #3a1a1a;
      --glow: rgba(255, 122, 26, .35);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12100e;
    --surface: #1d1a17;
    --surface-2: #2a2622;
    --text: #f3eee8;
    --muted: #a39a90;
    --border: #3a342e;
    --accent: #ff7a1a;
    --accent-2: #ffc14d;
    --accent-ink: #1a0d03;
    --good: #51cf66;
    --good-bg: #16301e;
    --bad: #ff6b6b;
    --bad-bg: #3a1a1a;
    --glow: rgba(255, 122, 26, .35);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }

  /* Topplinje */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .top .wrap { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
  .brand { font-weight: 800; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; font-size: 17px; }
  .brand .flame { font-size: 20px; }
  .spacer { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .chip .star { color: var(--accent-2); }

  /* Startside */
  .hero { padding: 28px 0 8px; }
  .hero h1 { font-size: clamp(28px, 7vw, 40px); line-height: 1.1; margin: 0 0 8px; letter-spacing: -.02em; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { margin: 0; color: var(--muted); max-width: 52ch; }
  .rank {
    margin: 20px 0 8px; padding: 14px 16px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .rank-row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .rank-title { font-weight: 700; }
  .rank-next { color: var(--muted); font-size: 13px; }
  .meter { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
  .meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: inherit; box-shadow: 0 0 12px var(--glow); transition: width .5s; }

  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 28px; }
  @media (max-width: 560px) {
    .modes { grid-template-columns: 1fr; }
    .modes .mode { display: grid; grid-template-columns: 34px 1fr; column-gap: 10px; align-items: center; }
    .modes .mode .ic { grid-row: span 2; }
  }
  .mode {
    text-align: left; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 4px; transition: transform .15s, border-color .15s;
  }
  .mode:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
  .mode:disabled { opacity: .5; cursor: not-allowed; }
  .mode .ic { font-size: 24px; }
  .mode b { font-size: 15px; }
  .mode span { color: var(--muted); font-size: 13px; }

  h2.section { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }

  /* Kartet */
  .map { position: relative; display: flex; flex-direction: column; gap: 10px; }
  .map::before {
    content: ""; position: absolute; left: 27px; top: 20px; bottom: 20px; width: 3px;
    background: repeating-linear-gradient(to bottom, var(--border) 0 8px, transparent 8px 14px);
  }
  .station {
    position: relative; display: flex; align-items: center; gap: 14px; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px 12px 12px; box-shadow: var(--shadow); transition: transform .15s, border-color .15s;
  }
  .station:hover { transform: translateX(3px); border-color: var(--accent); }
  .station .badge {
    flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface-2); border: 2px solid var(--border); font-size: 16px; z-index: 1;
  }
  .station.done .badge { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
  .station .info { flex: 1; min-width: 0; }
  .station .name { font-weight: 700; display: block; }
  .station .meta { color: var(--muted); font-size: 13px; }
  .stars { color: var(--accent-2); letter-spacing: 2px; font-size: 15px; white-space: nowrap; }
  .stars .off { color: var(--border); }

  .foot { margin-top: 28px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 13px; }

  /* Felles kort og knapper */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 12px; padding: 12px 18px; font-weight: 700; border: 1px solid var(--border);
    background: var(--surface); transition: transform .1s, filter .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 16px var(--glow); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .btn-row .btn { flex: 1 1 160px; }
  .back { background: none; border: 0; color: var(--muted); padding: 16px 0 8px; font-size: 14px; }

  /* Huskeregler */
  .intro-head { display: flex; gap: 14px; align-items: center; margin: 8px 0 16px; }
  .intro-head .big { font-size: 44px; line-height: 1; }
  .intro-head h1 { margin: 0; font-size: 26px; line-height: 1.15; }
  .intro-head .meta { color: var(--muted); font-size: 14px; }
  .facts { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .facts li { position: relative; padding-left: 28px; }
  .facts li::before { content: "▸"; position: absolute; left: 6px; color: var(--accent); font-weight: 800; }
  .facts b { color: var(--accent); }
  .tip { color: var(--muted); font-size: 13px; margin-top: 14px; }

  /* Quiz */
  .hud { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; flex-wrap: wrap; }
  .hud .lives { font-size: 18px; letter-spacing: 1px; }
  .hud .lives .lost { filter: grayscale(1); opacity: .25; }
  .hud .score { font-weight: 800; font-variant-numeric: tabular-nums; }
  .progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
  .progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width .3s; }
  .progress.timer > i { transition: width .2s linear; }
  .streak { color: var(--accent); font-weight: 800; font-size: 13px; }
  .qmeta { color: var(--muted); font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
  .q { font-size: 19px; font-weight: 700; line-height: 1.35; margin: 0 0 16px; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
    background: var(--surface-2); border: 2px solid transparent; border-radius: 12px; padding: 12px 14px;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:active:not(:disabled) { transform: scale(.99); }
  .opt .key {
    flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 700; color: var(--muted);
  }
  .opt:disabled { cursor: default; }
  .opt[hidden] { display: none; }
  .opt.correct { background: var(--good-bg); border-color: var(--good); }
  .opt.correct .key { background: var(--good); color: #fff; border-color: var(--good); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .opt.wrong .key { background: var(--bad); color: #fff; border-color: var(--bad); }
  .opt.dim { opacity: .55; }
  .tf { flex-direction: row; }
  .tf .opt { justify-content: center; font-weight: 700; font-size: 17px; padding: 16px; }

  .num-row { display: flex; gap: 10px; }
  .num-row input {
    flex: 1; min-width: 0; font: inherit; font-size: 20px; font-weight: 700; padding: 12px 14px; border-radius: 12px;
    border: 2px solid var(--border); background: var(--surface-2); color: var(--text);
  }
  .num-row input:focus { outline: none; border-color: var(--accent); }
  .num-row .unit { align-self: center; color: var(--muted); font-weight: 700; }

  .order-slots { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .slot {
    display: flex; gap: 10px; align-items: center; min-height: 46px; padding: 8px 12px; border-radius: 12px;
    border: 2px dashed var(--border); color: var(--muted); text-align: left; background: none; width: 100%;
  }
  .slot.filled { border-style: solid; border-color: var(--accent); background: var(--surface-2); color: var(--text); }
  .slot .n { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--surface); border: 1px solid var(--border); }
  .slot.ok { border-color: var(--good); background: var(--good-bg); }
  .slot.no { border-color: var(--bad); background: var(--bad-bg); }
  .pool { display: flex; flex-wrap: wrap; gap: 8px; }
  .pool .opt { width: auto; padding: 10px 14px; }

  .feedback { margin-top: 16px; border-radius: 14px; padding: 14px 16px; border: 1px solid; animation: pop .25s ease-out; }
  .feedback.good { background: var(--good-bg); border-color: var(--good); }
  .feedback.bad { background: var(--bad-bg); border-color: var(--bad); }
  .feedback h3 { margin: 0 0 4px; font-size: 17px; }
  .feedback.good h3 { color: var(--good); }
  .feedback.bad h3 { color: var(--bad); }
  .feedback p { margin: 4px 0 0; }
  .feedback .ref { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .gain { font-weight: 800; color: var(--accent); }

  @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .shake { animation: shake .3s; }
  .flash-good { box-shadow: 0 0 0 3px var(--good) inset, var(--shadow); }
  .flash-bad { box-shadow: 0 0 0 3px var(--bad) inset, var(--shadow); }

  /* Resultat */
  .result { text-align: center; padding-top: 24px; }
  .result .big-stars { font-size: 48px; letter-spacing: 6px; color: var(--accent-2); }
  .result .big-stars .off { color: var(--border); }
  .result h1 { margin: 6px 0 4px; font-size: 26px; }
  .result .sub { color: var(--muted); margin: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 8px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .missed { text-align: left; margin-top: 8px; }
  .missed h2 { font-size: 16px; margin: 20px 0 10px; }
  .miss { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--bad); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .miss .mq { font-weight: 600; }
  .miss .ma { color: var(--good); font-weight: 700; margin-top: 4px; }
  .miss .mr { color: var(--muted); font-size: 12px; margin-top: 4px; }

  /* Konfetti */
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .confetti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .7; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .confetti { display: none; }
  }

  /* Læring */
  .cta {
    display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; margin: 20px 0 8px;
    padding: 16px; border-radius: 16px; border: 2px solid var(--accent);
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--surface)), var(--surface));
    box-shadow: 0 4px 20px var(--glow);
  }
  .cta .ic { font-size: 34px; }
  .cta b { display: block; font-size: 17px; }
  .cta span { color: var(--muted); font-size: 14px; }
  .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; margin: 16px 0 0; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 9px 8px; font-weight: 700; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .seg-note { color: var(--muted); font-size: 13px; margin: 6px 2px 0; }
  .station .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .tag { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--surface-2); color: var(--muted); }
  .tag.ok { background: var(--good-bg); color: var(--good); }
  .station.intro-st { border-color: var(--accent); }
  .big-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  @media (max-width: 480px) { .big-actions { grid-template-columns: 1fr; } }
  .big-actions .btn { flex-direction: column; padding: 18px 12px; font-size: 16px; gap: 2px; }
  .big-actions .btn small { font-weight: 500; font-size: 12px; opacity: .85; }
  .dots { display: flex; gap: 6px; margin: 4px 0 14px; }
  .dots i { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-2); }
  .dots i.on { background: var(--accent); }
  .lesson h2 { margin: 0 0 10px; font-size: 22px; line-height: 1.2; }
  .lbody p { margin: 0 0 10px; }
  .lbody ul, .lbody ol { margin: 0 0 10px; padding-left: 22px; }
  .lbody li { margin-bottom: 6px; }
  .lbody ul.tight li { margin-bottom: 2px; }
  .lbody b { color: var(--accent); }
  .check { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--border); }
  .check-h { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
  .hint { margin-top: 10px; background: none; border: 1px dashed var(--border); color: var(--muted); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
  .hint:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .note { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .gloss-search { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--text); margin-bottom: 12px; }
  .gloss-search:focus { outline: none; border-color: var(--accent); }
  .gloss dt { font-weight: 800; color: var(--accent); margin-top: 12px; }
  .gloss dd { margin: 2px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" data-act="home"><span class="flame">🔥</span>Smelteprøven</button>
    <span class="spacer"></span>
    <button class="chip" data-act="glossary">📘 Ordliste</button>
    <span class="chip" id="chip-stars"><span class="star">★</span> 0</span>
  </div>
</header>
<main class="wrap" id="app"></main>

<script src="questions.js"></script>
<script src="lessons.js"></script>
<script>
(() => {
  const SAVE_KEY = 'stalverk-smelteprove-v1';
  const LYN_SECONDS = 60;
  const LIVES = 3;
  const LEVELS = {
    ny: { label: '🌱 Nybegynner', round: 8, final: 15, lives: false, hint: true, hard: false, note: 'Grunnleggende spørsmål, ingen liv å miste, 50/50-hint, og feil kommer igjen til du klarer dem.' },
    erfaren: { label: '🔥 Erfaren', round: 10, final: 20, lives: true, hint: false, hard: true, note: 'Alle spørsmål, også de vanskelige. Tre elektroder (liv) per runde.' }
  };

  const RANKS = [
    [0, 'Lærling i skraplageret'],
    [4, 'Skrapklasser'],
    [10, 'Dørkoperatør'],
    [18, 'Øseovnsoperatør'],
    [26, 'Stålovnsoperatør'],
    [34, 'Metallurg'],
    [42, 'Stålverksmester']
  ];
  const GOOD = ['Rett i stålbadet!', 'Godt tettet!', 'Perfekt skumslagg!', 'Full inngang på legeringen!', 'Innenfor analysen!', 'Strålende utstøpning!', 'Tappeklar!'];
  const BAD = ['Fosforbom!', 'Elektrodebrudd!', 'Groing i terningen!', 'Kok i øsa!', 'Analysebom!', 'Pipe i emnet!', 'Overslag!'];

  const ALL = [];
  ZONES.forEach(z => z.qs.forEach((q, i) => { q.id = z.id + '-' + i; q.zone = z.id; ALL.push(q); }));
  const BY_ID = Object.fromEntries(ALL.map(q => [q.id, q]));
  const ZONE_BY_ID = Object.fromEntries(ZONES.map(z => [z.id, z]));
  const MAX_STARS = ZONES.length * 3;

  // Lagring
  function load() {
    try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; }
  }
  const P = Object.assign({ zones: {}, wrong: [], lynBest: 0, finalBest: 0, lessons: {}, level: 'ny', stats: {} }, load());
  if (!LEVELS[P.level]) P.level = 'ny';
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(P)); } catch (e) { /* privat modus o.l. */ }
  }
  function markWrong(id) { if (!P.wrong.includes(id)) P.wrong.push(id); }
  function markRight(id) { P.wrong = P.wrong.filter(x => x !== id); }
  // Statistikk per spørsmål: n = antall ganger sett, r = riktige på rad, t = sist sett
  function record(id, ok) {
    const st = P.stats[id] || { n: 0, r: 0 };
    st.n++;
    st.r = ok ? st.r + 1 : 0;
    st.t = Date.now();
    P.stats[id] = st;
    if (ok) markRight(id); else markWrong(id);
  }
  const MASTERED = 2;  // riktige på rad før et spørsmål regnes som mestret
  const isMastered = id => ((P.stats[id] || {}).r || 0) >= MASTERED;
  // Smart trekking: først det du har bommet på, så det du ikke har sett,
  // så det du ikke har mestret ennå, og til slutt det du kan. Innen hver gruppe kommer det
  // som er lengst siden du så, først.
  function pickQuestions(pool, n, keepOrder) {
    const tier = q => P.wrong.includes(q.id) ? 0 : !P.stats[q.id] ? 1 : isMastered(q.id) ? 3 : 2;
    const ranked = shuffle(pool)
      .map(q => ({ q, k: tier(q), t: (P.stats[q.id] || {}).t || 0 }))
      .sort((a, b) => a.k - b.k || a.t - b.t);
    const chosen = ranked.slice(0, n).map(x => x.q);
    return keepOrder ? chosen : shuffle(chosen);
  }
  const masteredCount = qs => qs.filter(q => isMastered(q.id)).length;

  // Hjelpere
  const $app = document.getElementById('app');
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const starsHtml = n => '★'.repeat(n) + '<span class="off">' + '★'.repeat(3 - n) + '</span>';
  const totalStars = () => ZONES.reduce((s, z) => s + ((P.zones[z.id] || {}).stars || 0), 0);
  const L = () => LEVELS[P.level];
  const levelPool = qs => L().hard ? qs : qs.filter(q => !q.h);
  function rankOf(stars) {
    let cur = RANKS[0], next = null;
    for (let i = 0; i < RANKS.length; i++) {
      if (stars >= RANKS[i][0]) { cur = RANKS[i]; next = RANKS[i + 1] || null; }
    }
    return { cur, next };
  }
  const fmtNum = (v, tol) => v.toLocaleString('nb-NO', { minimumFractionDigits: tol >= 1 ? 0 : 2, maximumFractionDigits: tol >= 1 ? 0 : 2 });
  function correctText(q) {
    if (q.t === 'tf') return q.ans ? 'Sant' : 'Usant';
    if (q.t === 'num') return fmtNum(q.ans, q.tol) + (q.unit ? ' ' + q.unit : '');
    if (q.t === 'order') return q.items.join(' → ');
    return q.a[0];
  }
  function updateChip() {
    document.getElementById('chip-stars').innerHTML = '<span class="star">★</span> ' + totalStars() + ' / ' + MAX_STARS;
  }
  function scrollTop() { window.scrollTo(0, 0); }

  let R = null;        // aktiv quizrunde
  let ACTIVE = null;   // aktivt spørsmål (for tastatur)
  let timerId = null;

  // ---------- Felles spørsmålskomponent ----------
  // Tegner et spørsmål i host og kaller o.onDone(riktig, bruktHint) når det er besvart.
  // onDone kan returnere { title, note } som vises i tilbakemeldingen.
  function mountQuestion(host, q, o) {
    const el = document.createElement('div');
    host.innerHTML = '';
    host.appendChild(el);
    const st = { locked: false, hint: false };
    let opts = null, pool = null, picked = [];
    let body = '';

    if (!q.t) {
      opts = shuffle(q.a.map((text, k) => ({ text, correct: k === 0 })));
      body = `<div class="opts">${opts.map((op, k) => `<button class="opt" data-a="mc" data-k="${k}"><span class="key">${k + 1}</span><span>${op.text}</span></button>`).join('')}</div>`;
    } else if (q.t === 'tf') {
      opts = [{ text: 'Sant', correct: q.ans === true }, { text: 'Usant', correct: q.ans === false }];
      body = `<div class="opts tf">${opts.map((op, k) => `<button class="opt" data-a="mc" data-k="${k}">${k === 0 ? '✅' : '❌'} ${op.text}</button>`).join('')}</div>`;
    } else if (q.t === 'num') {
      body = `<form class="num-row"><input inputmode="decimal" autocomplete="off" placeholder="Ditt svar" aria-label="Ditt svar">${q.unit ? `<span class="unit">${q.unit}</span>` : ''}<button class="btn primary" type="submit">Svar</button></form>`;
    } else if (q.t === 'order') {
      pool = shuffle(q.items.map((_, k) => k));
      if (pool.every((v, k) => v === k)) pool.reverse();
      body = `<div class="order-box"></div>`;
    }
    const canHint = o.hint && !q.t && q.a.length >= 3;
    el.innerHTML = `<p class="q">${q.t === 'order' ? '🔢 ' : q.t === 'num' ? '🧮 ' : ''}${q.q}</p>${body}
      ${canHint ? `<button class="hint" data-a="hint">💡 Hint: fjern to feil svar</button>` : ''}
      <div class="fb"></div>`;

    function renderOrder(result) {
      const box = el.querySelector('.order-box');
      const slots = q.items.map((_, k) => {
        const idx = picked[k];
        const filled = idx !== undefined;
        let cls = filled ? 'filled' : '';
        if (result) cls += idx === k ? ' ok' : ' no';
        return `<button class="slot ${cls}" ${filled && !result ? `data-a="unpick" data-k="${k}"` : 'disabled'}><span class="n">${k + 1}</span><span>${filled ? q.items[idx] : 'Trykk på et steg under'}</span></button>`;
      }).join('');
      const rest = pool.filter(k => !picked.includes(k));
      box.innerHTML = `<div class="order-slots">${slots}</div>
        ${result ? '' : `<div class="pool">${rest.map(k => `<button class="opt" data-a="pick" data-k="${k}">${q.items[k]}</button>`).join('')}</div>
        <div class="btn-row"><button class="btn primary" data-a="check-order" ${picked.length === q.items.length ? '' : 'disabled'}>Sjekk rekkefølgen</button></div>`}`;
    }
    if (q.t === 'order') renderOrder();

    function finish(ok, chosen) {
      if (st.locked) return;
      st.locked = true;
      ACTIVE = null;
      if (opts) {
        el.querySelectorAll('[data-a="mc"]').forEach(b => {
          const op = opts[+b.dataset.k];
          b.disabled = true;
          if (op.correct) b.classList.add('correct');
          else if (+b.dataset.k === chosen) b.classList.add('wrong');
          else b.classList.add('dim');
        });
      }
      const hb = el.querySelector('[data-a="hint"]');
      if (hb) hb.remove();
      const extra = o.onDone(ok, st.hint) || {};
      if (o.quick) return;
      const learn = o.tone === 'learn';
      const title = extra.title || (ok ? (learn ? '✅ Riktig!' : '✅ ' + pick(GOOD)) : (learn ? '🤔 Ikke helt' : '💥 ' + pick(BAD)));
      el.querySelector('.fb').innerHTML = `
        <div class="feedback ${ok ? 'good' : 'bad'}">
          <h3>${title}</h3>
          ${q.t === 'tf' ? `<p><b>Påstanden er ${q.ans ? 'sann' : 'usann'}.</b></p>` : ''}
          ${!ok && (q.t === 'num' || q.t === 'order') ? `<p><b>Riktig svar:</b> ${correctText(q)}</p>` : ''}
          ${!ok && !q.t ? `<p><b>Riktig svar:</b> ${q.a[0]}</p>` : ''}
          <p>${q.e}</p>
          ${extra.note ? `<p class="note">${extra.note}</p>` : ''}
          <div class="ref">📖 Kompendiet s. ${q.p}</div>
        </div>`;
      el.querySelector('.feedback').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function choose(k) {
      if (st.locked || !opts || k >= opts.length) return;
      const b = el.querySelector(`[data-a="mc"][data-k="${k}"]`);
      if (!b || b.hidden) return;
      finish(opts[k].correct, k);
    }

    el.addEventListener('click', e => {
      const b = e.target.closest('[data-a]');
      if (!b || b.disabled || st.locked) return;
      const a = b.dataset.a, k = +b.dataset.k;
      if (a === 'mc') choose(k);
      else if (a === 'hint') {
        st.hint = true;
        const wrongs = shuffle(opts.map((op, i) => i).filter(i => !opts[i].correct));
        wrongs.slice(0, opts.length - 2).forEach(i => { el.querySelector(`[data-a="mc"][data-k="${i}"]`).hidden = true; });
        b.disabled = true;
        b.textContent = '💡 To feil svar er fjernet';
      }
      else if (a === 'pick') { picked.push(k); renderOrder(); }
      else if (a === 'unpick') { picked.splice(k, 1); renderOrder(); }
      else if (a === 'check-order') { renderOrder(true); finish(picked.every((v, i) => v === i)); }
    });

    const form = el.querySelector('form');
    if (form) {
      const inp = form.querySelector('input');
      form.addEventListener('submit', e => {
        e.preventDefault();
        if (st.locked) return;
        const raw = inp.value.trim();
        if (!raw) { inp.focus(); return; }
        const v = parseFloat(raw.replace(/\s/g, '').replace(',', '.'));
        const ok = !isNaN(v) && Math.abs(v - q.ans) <= q.tol + 1e-9;
        inp.disabled = true;
        form.querySelector('button').disabled = true;
        inp.style.borderColor = ok ? 'var(--good)' : 'var(--bad)';
        finish(ok);
      });
      if (o.focus && matchMedia('(pointer: fine)').matches) inp.focus();
    }
    ACTIVE = { choose };
  }

  // ---------- Startside ----------
  function renderHome() {
    stopTimer();
    R = null; ACTIVE = null;
    updateChip();
    const ts = totalStars();
    const { cur, next } = rankOf(ts);
    const pct = next ? ((ts - cur[0]) / (next[0] - cur[0])) * 100 : 100;
    const wrongN = P.wrong.filter(id => BY_ID[id] && (L().hard || !BY_ID[id].h)).length;
    const introDone = P.lessons.intro;

    $app.innerHTML = `
      <section class="hero">
        <h1>Lær stålverket <em>fra skrap til emne</em></h1>
        <p>Les korte leksjoner om hver stasjon, sjekk at du har forstått, og øv deg til du får tre stjerner.</p>
      </section>
      ${introDone ? '' : `<button class="cta" data-act="lesson" data-id="intro"><span class="ic">🌱</span><span><b>Ny i stålverket? Start her</b><span>«Stålverket på 5 minutter» gir deg oversikten først.</span></span></button>`}
      <div class="seg" role="group" aria-label="Nivå">
        ${Object.entries(LEVELS).map(([k, v]) => `<button class="${P.level === k ? 'on' : ''}" data-act="level" data-id="${k}">${v.label}</button>`).join('')}
      </div>
      <p class="seg-note">${L().note}</p>
      <div class="rank">
        <div class="rank-row">
          <span class="rank-title">🎖️ ${cur[1]}</span>
          <span class="rank-next">${next ? `${next[0] - ts} ★ til <b>${next[1]}</b>` : 'Høyeste rang oppnådd!'}</span>
        </div>
        <div class="meter"><i style="width:${pct}%"></i></div>
      </div>
      <h2 class="section" style="margin-top:24px">Stasjonene i verket</h2>
      <div class="map">
        <button class="station intro-st ${introDone ? 'done' : ''}" data-act="lesson" data-id="intro">
          <span class="badge">${INTRO.icon}</span>
          <span class="info"><span class="name">Start her: ${INTRO.name}</span><span class="tags">${introDone ? '<span class="tag ok">📖 Lest</span>' : `<span class="tag">${INTRO.cards.length} korte kort</span>`}</span></span>
        </button>
        ${ZONES.map((z, i) => {
          const zp = P.zones[z.id] || {};
          const s = zp.stars || 0;
          const read = P.lessons[z.id];
          return `<button class="station ${s ? 'done' : ''}" data-act="zone" data-id="${z.id}">
            <span class="badge">${z.icon}</span>
            <span class="info"><span class="name">${i + 1}. ${z.name}</span>
              <span class="tags">${read ? '<span class="tag ok">📖 Lest</span>' : '<span class="tag">📖 Ikke lest</span>'}${(() => { const pool = levelPool(z.qs), m = masteredCount(pool); return m ? `<span class="tag ${m === pool.length ? 'ok' : ''}">✅ ${m}/${pool.length} mestret</span>` : ''; })()}${zp.expert ? `<span class="tag ok">🔥 Erfaren ${'★'.repeat(zp.expert)}</span>` : ''}</span></span>
            <span class="stars">${starsHtml(s)}</span>
          </button>`;
        }).join('')}
      </div>
      <h2 class="section" style="margin-top:28px">Når du har lært litt</h2>
      <div class="modes">
        <button class="mode" data-act="lyn"><span class="ic">⚡</span><b>Lynrunde</b><span>${LYN_SECONDS} sekunder, så mange du rekker. Rekord: ${P.lynBest}</span></button>
        <button class="mode" data-act="final"><span class="ic">🏆</span><b>Sluttprøven</b><span>${L().final} spørsmål fra hele verket. Rekord: ${P.finalBest}</span></button>
        <button class="mode" data-act="retry" ${wrongN ? '' : 'disabled'}><span class="ic">🔁</span><b>Øv på feilene</b><span>${wrongN ? wrongN + ' spørsmål du har bommet på' : 'Ingen feil å øve på ennå'}</span></button>
      </div>
      <div class="foot">
        <span>Basert på metallurgikurs-kompendiet (7 Steel, 2. utg. 2024). Sidetallene viser til kompendiet.</span>
        <button class="link" data-act="reset">Nullstill fremgang</button>
      </div>`;
    scrollTop();
  }

  // ---------- Stasjonsside ----------
  function renderZone(zid) {
    const z = ZONE_BY_ID[zid];
    const zp = P.zones[zid] || {};
    const read = P.lessons[zid];
    const pool = levelPool(z.qs);
    const n = Math.min(L().round, pool.length);
    const m = masteredCount(pool);
    $app.innerHTML = `
      <button class="back" data-act="home">← Til kartet</button>
      <div class="intro-head">
        <span class="big">${z.icon}</span>
        <div><h1>${z.name}</h1><div class="meta">Kompendiet ${z.pages} · <span class="stars">${starsHtml(zp.stars || 0)}</span></div></div>
      </div>
      <div class="rank" style="margin-top:0">
        <div class="rank-row"><span class="rank-title">✅ ${m} av ${pool.length} spørsmål mestret</span><span class="rank-next">${L().label}</span></div>
        <div class="meter"><i style="width:${pool.length ? m / pool.length * 100 : 0}%"></i></div>
        <p class="tip" style="margin:8px 0 0">Et spørsmål er mestret når du har svart riktig på det ${MASTERED} ganger på rad. Øvingen gir deg først det du har bommet på og det du ikke har sett.</p>
      </div>
      <div class="big-actions" style="margin-top:12px">
        <button class="btn ${read ? '' : 'primary'}" data-act="lesson" data-id="${z.id}">📖 ${read ? 'Les igjen' : 'Lær først'}<small>${LESSONS[z.id].length} korte kort med sjekkspørsmål</small></button>
        <button class="btn ${read ? 'primary' : ''}" data-act="start-zone" data-id="${z.id}">🎯 Øv<small>${n} spørsmål · ${L().label}</small></button>
      </div>
      <div class="card" style="margin-top:16px">
        <h2 class="section">🧠 Huskeregler</h2>
        <ul class="facts">${z.facts.map(f => `<li>${f}</li>`).join('')}</ul>
      </div>`;
    scrollTop();
  }

  // ---------- Leksjon ----------
  function renderLesson(zid, i = 0) {
    stopTimer(); R = null;
    const isIntro = zid === 'intro';
    const z = isIntro ? INTRO : ZONE_BY_ID[zid];
    const cards = isIntro ? INTRO.cards : LESSONS[zid];
    const summary = !isIntro;           // stasjonene får huskeregler som siste kort
    const total = cards.length + (summary ? 1 : 0);
    const last = i === total - 1;
    const isSummary = summary && i === cards.length;
    if (last) { P.lessons[zid] = true; save(); }

    let content;
    if (isSummary) {
      content = `<h2>🧠 Oppsummering</h2><ul class="facts">${z.facts.map(f => `<li>${f}</li>`).join('')}</ul>
        <p class="tip">Bra jobba! Nå er du klar til å øve. Spørsmål du bommer på, kommer tilbake til du klarer dem.</p>`;
    } else {
      const c = cards[i];
      content = `<h2>${c.title}</h2><div class="lbody">${c.body}</div>
        ${c.check && BY_ID[c.check] ? `<div class="check"><p class="check-h">🤔 Sjekk deg selv</p><div id="check-host"></div></div>` : ''}`;
    }
    const nextBtn = last
      ? (isIntro ? `<button class="btn primary" data-act="home">✅ Ferdig, til kartet</button>`
                 : `<button class="btn primary" data-act="start-zone" data-id="${zid}">🎯 Øv nå</button>`)
      : `<button class="btn primary" data-act="lesson" data-id="${zid}" data-i="${i + 1}">Neste →</button>`;

    $app.innerHTML = `
      <button class="back" data-act="${isIntro ? 'home' : 'zone'}" data-id="${zid}">← ${isIntro ? 'Til kartet' : 'Til stasjonen'}</button>
      <div class="qmeta"><span>${z.icon} ${z.name}</span><span>Kort ${i + 1} av ${total}</span></div>
      <div class="dots">${Array.from({ length: total }, (_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
      <article class="card lesson">${content}</article>
      <div class="btn-row">
        ${i > 0 ? `<button class="btn" data-act="lesson" data-id="${zid}" data-i="${i - 1}">← Forrige</button>` : ''}
        ${nextBtn}
      </div>`;
    const host = document.getElementById('check-host');
    if (host) {
      const q = BY_ID[cards[i].check];
      mountQuestion(host, q, {
        tone: 'learn', hint: false, focus: false,
        onDone: ok => { record(q.id, ok); save(); }
      });
    }
    scrollTop();
  }

  // ---------- Ordliste ----------
  function renderGlossary() {
    stopTimer(); R = null; ACTIVE = null;
    $app.innerHTML = `
      <button class="back" data-act="home">← Til kartet</button>
      <div class="intro-head"><span class="big">📘</span><div><h1>Ordliste</h1><div class="meta">Faguttrykk du hører i stålverket</div></div></div>
      <input class="gloss-search" id="gloss-q" placeholder="Søk etter et ord …" autocomplete="off">
      <dl class="gloss" id="gloss-list"></dl>`;
    const list = document.getElementById('gloss-list');
    const draw = f => {
      const t = f.trim().toLowerCase();
      const rows = GLOSSARY.filter(([w, d]) => !t || w.toLowerCase().includes(t) || d.toLowerCase().includes(t));
      list.innerHTML = rows.length ? rows.map(([w, d]) => `<dt>${w}</dt><dd>${d}</dd>`).join('') : '<p class="tip">Ingen treff.</p>';
    };
    draw('');
    document.getElementById('gloss-q').addEventListener('input', e => draw(e.target.value));
    scrollTop();
  }

  // ---------- Øverunde ----------
  function startRound(mode, opts = {}) {
    const lv = L();
    let list;
    if (mode === 'zone') list = pickQuestions(levelPool(ZONE_BY_ID[opts.zone].qs), lv.round);
    else if (mode === 'final') list = pickQuestions(levelPool(ALL), lv.final);
    else if (mode === 'retry') list = shuffle(P.wrong.map(id => BY_ID[id]).filter(q => q && (lv.hard || !q.h))).slice(0, lv.round);
    else if (mode === 'lyn') { const pool = levelPool(ALL).filter(q => !q.t || q.t === 'tf'); list = pickQuestions(pool, pool.length, true); }
    if (!list.length) return renderHome();
    R = {
      mode, zone: opts.zone || null, list, unique: list.length, i: 0,
      lives: lv.lives && mode !== 'lyn' ? LIVES : Infinity,
      repeat: !lv.lives && mode !== 'lyn',
      score: 0, streak: 0, bestStreak: 0, firstRight: 0, correct: 0, answered: 0,
      seen: new Set(), requeued: new Set(), missed: [], over: false
    };
    if (mode === 'lyn') {
      R.end = Date.now() + LYN_SECONDS * 1000;
      timerId = setInterval(tickTimer, 200);
    }
    renderQuestion();
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function tickTimer() {
    if (!R || R.mode !== 'lyn') return stopTimer();
    const left = Math.max(0, R.end - Date.now());
    const bar = document.getElementById('timer-bar');
    const txt = document.getElementById('timer-txt');
    if (bar) bar.style.width = (left / (LYN_SECONDS * 1000) * 100) + '%';
    if (txt) txt.textContent = Math.ceil(left / 1000) + ' s';
    if (left <= 0) { stopTimer(); finishRound(); }
  }

  function modeLabel() {
    if (R.mode === 'zone') return ZONE_BY_ID[R.zone].icon + ' ' + ZONE_BY_ID[R.zone].name;
    if (R.mode === 'final') return '🏆 Sluttprøven';
    if (R.mode === 'retry') return '🔁 Øv på feilene';
    return '⚡ Lynrunde';
  }

  function hudHtml() {
    const lives = R.lives === Infinity ? '' :
      `<span class="lives" title="Elektroder igjen">${Array.from({ length: LIVES }, (_, k) => `<span class="${k < R.lives ? '' : 'lost'}">⚡</span>`).join('')}</span>`;
    const prog = R.mode === 'lyn'
      ? `<div class="progress timer"><i id="timer-bar" style="width:${Math.max(0, R.end - Date.now()) / (LYN_SECONDS * 1000) * 100}%"></i></div>`
      : `<div class="progress"><i style="width:${(R.i / R.list.length) * 100}%"></i></div>`;
    return `<div class="hud">
        <span class="chip">${modeLabel()}</span>
        <span class="spacer"></span>
        ${R.streak >= 2 ? `<span class="streak">🔥 ${R.streak} på rad</span>` : ''}
        ${lives}
        <span class="chip score">${R.mode === 'lyn' ? `<span id="timer-txt">${Math.ceil(Math.max(0, R.end - Date.now()) / 1000)} s</span> · ${R.correct} riktige` : R.score + ' p'}</span>
      </div>
      ${prog}`;
  }

  function renderQuestion() {
    if (R.mode === 'lyn' && R.i >= R.list.length) R.list = R.list.concat(shuffle(R.list));
    const q = R.list[R.i];
    const z = ZONE_BY_ID[q.zone];
    const again = R.seen.has(q.id);
    const counter = R.mode === 'lyn' ? `#${R.i + 1}` : `Spørsmål ${R.i + 1} av ${R.list.length}`;
    $app.innerHTML = `
      <button class="back" data-act="quit">← Avbryt</button>
      <div id="hud-box">${hudHtml()}</div>
      <div class="card" id="qcard">
        <div class="qmeta"><span>${counter}${again ? ' · 🔁 Nytt forsøk' : ''}</span><span>${R.mode === 'zone' ? '' : z.icon + ' ' + z.name}</span></div>
        <div id="q-host"></div>
        <div id="next-box"></div>
      </div>`;
    mountQuestion(document.getElementById('q-host'), q, {
      tone: 'game', hint: L().hint && R.mode !== 'lyn', quick: R.mode === 'lyn', focus: true,
      onDone: (ok, usedHint) => onAnswer(q, ok, usedHint)
    });
  }

  function onAnswer(q, ok, usedHint) {
    const first = !R.seen.has(q.id);
    R.seen.add(q.id);
    R.answered++;
    let gain = 0, note = '';
    if (ok) {
      R.correct++;
      if (first) R.firstRight++;
      R.streak++;
      R.bestStreak = Math.max(R.bestStreak, R.streak);
      gain = Math.round((100 + Math.min(R.streak - 1, 5) * 20) * (usedHint ? 0.5 : 1) * (first ? 1 : 0.5));
      R.score += gain;
      record(q.id, true);
    } else {
      R.streak = 0;
      if (R.lives !== Infinity) R.lives--;
      if (first) R.missed.push(q);
      record(q.id, false);
      if (R.repeat && !R.requeued.has(q.id)) {
        R.requeued.add(q.id);
        R.list.push(q);
        note = '🔁 Les forklaringen. Spørsmålet kommer tilbake senere i runden.';
      }
    }
    save();

    const card = document.getElementById('qcard');
    card.classList.add(ok ? 'flash-good' : 'flash-bad');
    if (!ok) card.classList.add('shake');

    if (R.mode === 'lyn') {
      document.getElementById('hud-box').innerHTML = hudHtml();
      setTimeout(() => { if (R && R.mode === 'lyn' && timerId) { R.i++; renderQuestion(); } }, ok ? 350 : 900);
      return {};
    }
    if (R.lives <= 0) R.over = true;
    const last = R.i >= R.list.length - 1 || R.over;
    document.getElementById('hud-box').innerHTML = hudHtml();
    document.getElementById('next-box').innerHTML = `
      ${R.over ? `<div class="feedback bad"><h3>🚨 Gjennombrudd!</h3><p>Alle elektrodene er brukt opp, og runden er over.</p></div>` : ''}
      <div class="btn-row"><button class="btn primary" data-act="next" id="next-btn">${last ? 'Se resultatet' : 'Neste →'}</button></div>`;
    document.getElementById('next-btn').focus({ preventScroll: true });
    let title;
    if (ok) title = '✅ ' + pick(GOOD) + ` <span class="gain">+${gain}</span>`;
    else if (R.lives === Infinity) title = '🤔 Ikke helt riktig';
    else title = '💥 ' + pick(BAD) + (R.lives > 0 ? ` (${R.lives} ⚡ igjen)` : '');
    return { title, note };
  }

  function next() {
    if (R.over || R.i >= R.list.length - 1) return finishRound();
    R.i++;
    renderQuestion();
    scrollTop();
  }

  // ---------- Resultat ----------
  function finishRound() {
    stopTimer();
    ACTIVE = null;
    const total = R.mode === 'lyn' ? R.answered : R.unique;
    const pct = total ? (R.mode === 'lyn' ? R.correct : R.firstRight) / total : 0;
    const stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.5 ? 1 : 0;
    let newRecord = false;

    if (R.mode === 'zone') {
      const zp = P.zones[R.zone] || { stars: 0, best: 0 };
      if (R.score > (zp.best || 0)) { zp.best = R.score; newRecord = true; }
      zp.stars = Math.max(zp.stars || 0, stars);
      if (P.level === 'erfaren') zp.expert = Math.max(zp.expert || 0, stars);
      P.zones[R.zone] = zp;
    } else if (R.mode === 'final') {
      if (R.firstRight > P.finalBest) { P.finalBest = R.firstRight; newRecord = true; }
    } else if (R.mode === 'lyn') {
      if (R.correct > P.lynBest) { P.lynBest = R.correct; newRecord = true; }
    }
    save();
    updateChip();

    let title, sub;
    if (R.mode === 'lyn') {
      title = R.correct >= 20 ? 'Lynende metallurg! ⚡' : R.correct >= 10 ? 'Rask på avtrekkeren!' : 'Varmer seg opp';
      sub = `${R.correct} riktige av ${R.answered} besvarte på ${LYN_SECONDS} sekunder.`;
    } else {
      title = R.over ? 'Gjennombrudd på strengen' : stars === 3 ? 'Klar for tapping! 🔥' : stars === 2 ? 'Nesten tappeklar' : stars === 1 ? 'God start' : 'Godt forsøk, prøv igjen';
      sub = `${R.firstRight} av ${total} riktige på første forsøk${R.over ? ' (resten telles som feil)' : ''}.`;
      if (R.repeat && R.missed.length) sub += ' Alle feilene ble rettet opp underveis.';
    }
    const showStars = R.mode !== 'lyn';
    const tip = R.mode === 'zone' && stars < 3
      ? `<p class="tip">💡 Tips: les leksjonen for ${ZONE_BY_ID[R.zone].name} en gang til, og prøv igjen.</p>` : '';

    $app.innerHTML = `
      <section class="result">
        ${showStars ? `<div class="big-stars">${starsHtml(stars)}</div>` : '<div class="big-stars">⚡</div>'}
        <h1>${title}</h1>
        <p class="sub">${sub}${newRecord ? ' <b>Ny rekord!</b>' : ''}</p>
        <div class="stats">
          <div class="stat"><b>${R.mode === 'lyn' ? R.correct : R.score}</b><span>${R.mode === 'lyn' ? 'riktige' : 'poeng'}</span></div>
          <div class="stat"><b>${Math.round(pct * 100)} %</b><span>treffsikkerhet</span></div>
          <div class="stat"><b>${R.bestStreak}</b><span>lengste rekke</span></div>
        </div>
        ${tip}
        <div class="btn-row">
          <button class="btn primary" data-act="again">🔁 Prøv igjen</button>
          ${R.mode === 'zone' ? `<button class="btn" data-act="lesson" data-id="${R.zone}">📖 Les leksjonen</button>` : ''}
          <button class="btn" data-act="home">🗺️ Til kartet</button>
        </div>
        ${R.missed.length ? `<div class="missed"><h2>Verdt å repetere (${R.missed.length})</h2>${R.missed.map(q => `
          <div class="miss"><div class="mq">${q.t === 'tf' ? 'Sant eller usant: ' : ''}${q.q}</div><div class="ma">✔ ${correctText(q)}</div><div class="mr">${q.e}</div><div class="mr">${ZONE_BY_ID[q.zone].icon} ${ZONE_BY_ID[q.zone].name} · Kompendiet s. ${q.p}</div></div>`).join('')}</div>` : ''}
      </section>`;
    scrollTop();
    if (showStars && stars === 3 && !R.over) confetti();
  }

  function confetti() {
    const box = document.createElement('div');
    box.className = 'confetti';
    const colors = ['#ff7a1a', '#ffc14d', '#e8590c', '#f59f00', '#51cf66', '#ffffff'];
    for (let i = 0; i < 60; i++) {
      const el = document.createElement('i');
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = pick(colors);
      el.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
      el.style.animationDelay = Math.random() * 0.4 + 's';
      box.appendChild(el);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 3800);
  }

  // ---------- Hendelser ----------
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const id = el.dataset.id;
    switch (el.dataset.act) {
      case 'home': renderHome(); break;
      case 'glossary': renderGlossary(); break;
      case 'zone': renderZone(id); break;
      case 'lesson': renderLesson(id, +(el.dataset.i || 0)); break;
      case 'level': P.level = id; save(); renderHome(); break;
      case 'start-zone': startRound('zone', { zone: id }); break;
      case 'lyn': startRound('lyn'); break;
      case 'final': startRound('final'); break;
      case 'retry': startRound('retry'); break;
      case 'quit': if (confirm('Avbryte runden? Fremgangen i denne runden blir ikke lagret.')) renderHome(); break;
      case 'next': next(); break;
      case 'again': {
        const { mode, zone } = R;
        startRound(mode, { zone });
        break;
      }
      case 'reset':
        if (confirm('Slette alle stjerner, rekorder, leste leksjoner og feil-listen?')) {
          Object.assign(P, { zones: {}, wrong: [], lynBest: 0, finalBest: 0, lessons: {}, stats: {} }); save(); renderHome();
        }
        break;
    }
  });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (ACTIVE && /^[1-9]$/.test(e.key)) ACTIVE.choose(+e.key - 1);
    else if (e.key === 'Enter' && R && R.mode !== 'lyn' && document.getElementById('next-btn')) { e.preventDefault(); next(); }
  });

  renderHome();
})();
</script>
</body>
</html>
